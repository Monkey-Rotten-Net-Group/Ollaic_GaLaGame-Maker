[package]
name = "ollaic"
version = "0.1.0"
description = "A Tauri desktop shell for Ollaic GaLaGame Maker"
edition = "2021"
# Two bin targets exist once the `agent-harness` feature is on; name the app
# explicitly so `cargo run` is never ambiguous.
default-run = "ollaic"

[lib]
name = "ollaic"
path = "src/lib.rs"

[[bin]]
name = "ollaic"
path = "src/main.rs"

# `agent-harness`: headless CLI over the same AI code paths. Feature-gated so a
# normal `cargo build` / `tauri build` never pulls clap or sha2 into the app.
[[bin]]
name = "agent-harness"
path = "src/bin/agent-harness.rs"
required-features = ["agent-harness"]

[features]
agent-harness = ["dep:clap", "dep:sha2"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
ureq = "3.3"

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
sha2 = { version = "0.10", optional = true }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.0"
genai = "0.5"
futures = "0.3"
futures-util = "0.3"
dirs = "5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "fs", "io-util", "time", "test-util"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
mime_guess = "2"
percent-encoding = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ort = "2.0.0-rc.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ndarray = "0.17"
crc32fast = "1"
