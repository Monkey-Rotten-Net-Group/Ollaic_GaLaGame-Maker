[package]
name = "ollaic-runtime"
version = "0.1.0"
edition = "2021"
description = "Shared WebGAL preview hosting and runtime installation"

[dependencies]
ollaic-core = { path = "../ollaic-core" }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
percent-encoding = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "fs", "io-util", "time"] }
tower-http = { version = "0.5", features = ["fs"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
tokio-tungstenite = "0.21"
zip = { version = "2", default-features = false, features = ["deflate"] }
