[package]
name = "ollaic-ffi"
version = "0.1.0"
edition = "2021"
description = "UniFFI bindings for Ollaic's shared project core"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
bindgen = ["uniffi/cli"]

[[bin]]
name = "ollaic-bindgen"
path = "src/bin/bindgen.rs"
required-features = ["bindgen"]

[dependencies]
ollaic-core = { path = "../ollaic-core" }
serde_json = "1"
thiserror = "2"
uniffi = "=0.32.2"
